name: Instagram Facebook Login Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-facebook-smoke.yml'
      - 'instagram_signal.py'
      - '.github/workflows/daily-articles.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instagram Facebook Login 実トークン疎通確認
        env:
          INSTAGRAM_FACEBOOK_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_USER_ID: ${{ secrets.INSTAGRAM_BUSINESS_USER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import instagram_signal as ig

          token = os.environ.get("INSTAGRAM_FACEBOOK_ACCESS_TOKEN", "").strip()
          user_id = os.environ.get("INSTAGRAM_BUSINESS_USER_ID", "").strip()
          if not token:
              raise SystemExit("INSTAGRAM_FACEBOOK_ACCESS_TOKEN secret is missing")
          if not user_id:
              raise SystemExit("INSTAGRAM_BUSINESS_USER_ID secret is missing")

          try:
              data = ig._business_discovery(token, user_id, "chigasakimuseum", media_limit=1)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Instagram Business Discovery HTTP {exc.code}: {body[:800]}")

          bd = data.get("business_discovery") or {}
          if not bd.get("username"):
              raise SystemExit(f"Unexpected Business Discovery response: {data}")
          print(f"Instagram Business Discovery OK: @{bd.get('username')}")

          try:
              hashtag_id = ig._hashtag_id(token, user_id, "藤沢")
              print(f"Instagram hashtag search diagnostic: {'OK' if hashtag_id else 'no result'}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Instagram hashtag search diagnostic unavailable: HTTP {exc.code}: {body[:500]}")
          PY
