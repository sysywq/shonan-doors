name: Daily Publication Watchdog

on:
  push:
    branches: [main]
  schedule:
    # JST 05:30-09:30, every 30 minutes. While the daily run is active, do nothing.
    - cron: '30 20-23 * * *'
    - cron: '0,30 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-publication-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check daily run and production publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from datetime import datetime, timezone, timedelta

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          jst=timezone(timedelta(hours=9))
          today=datetime.now(jst).date().isoformat()
          api=f"https://api.github.com/repos/{repo}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          runs=get(f"{api}/actions/workflows/daily-articles.yml/runs?per_page=20").get("workflow_runs",[])
          todays=[]
          for r in runs:
              created=datetime.fromisoformat(r["created_at"].replace("Z","+00:00")).astimezone(jst)
              if created.date().isoformat()==today:
                  todays.append(r)

          active=[r for r in todays if r["status"] in ("queued","in_progress","waiting","pending","requested")]
          # A run can remain in_progress forever when a generator/network call hangs.
          # Treat only recently-updated runs as healthy. Stale runs must not block recovery.
          now=datetime.now(timezone.utc)
          healthy=[]
          stale=[]
          for r in active:
              stamp=r.get("updated_at") or r.get("run_started_at") or r.get("created_at")
              touched=datetime.fromisoformat(stamp.replace("Z","+00:00"))
              age=(now-touched).total_seconds()/60
              (healthy if age < 15 else stale).append((r,age))
          if healthy:
              print("Daily run is active and recently progressing; watchdog will wait.")
              sys.exit(0)
          if stale:
              print("Stale active daily run detected; it will not block recovery:", [(r["id"], round(age,1)) for r,age in stale])

          # If a completed daily run exists, publication—not run success—is the final criterion.
          # Read today's articles from main and require >=3 production URLs to return HTTP 200.
          req=urllib.request.Request(
              f"https://raw.githubusercontent.com/{repo}/main/data/articles.json",
              headers={"Authorization":f"Bearer {token}"})
          with urllib.request.urlopen(req,timeout=30) as r:
              articles=json.load(r)
          rows=[a for a in articles if a.get("date")==today]
          live=[]
          for a in rows:
              aid=str(a.get("id","")).strip()
              if not aid:
                  continue
              url=f"https://www.shonandoors.com/articles/{aid}/"
              try:
                  q=urllib.request.Request(url,method="HEAD",headers={"User-Agent":"ShonanDoorsWatchdog/1.0"})
                  with urllib.request.urlopen(q,timeout=20) as resp:
                      if resp.status==200:
                          live.append(aid)
              except Exception as e:
                  print(f"Not live: {aid}: {e}")

          print(f"Production-confirmed articles for {today}: {len(live)} / 3")
          if len(live)>=3:
              print("Publication target satisfied; no recovery needed.")
              sys.exit(0)

          # No active run and production is short: recover. This covers missing schedule,
          # failed/cancelled runs, and green runs that did not actually publish 3 articles.
          print("Publication target not satisfied and no daily run is active; dispatching recovery.")
          data=json.dumps({"ref":"main"}).encode()
          req=urllib.request.Request(
              f"{api}/actions/workflows/daily-articles.yml/dispatches",
              data=data, method="POST",
              headers={**headers,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as resp:
              print("Recovery dispatch status:",resp.status)
          PY
