name: Fact Audit (primary sources)

# 既存記事を一次情報だけで照合する監査。手動実行のみ。
# articles.json は一切変更せず、レポートをArtifactとして保存する。
# 1記事ごとに audit_reports/*.jsonl へ追記するため、途中で失敗しても
# 処理済みの結果はArtifactに残る。resume_run_id を指定すると、その実行の結果の
# うち confirmed / fix / rewrite 済みの記事は再監査せずに引き継ぐ。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '対象記事ID(カンマ区切り。空なら範囲指定または全件)'
        required: false
        default: ''
      start:
        description: '開始ID(分割実行用)'
        required: false
        default: ''
      end:
        description: '終了ID(分割実行用)'
        required: false
        default: ''
      resume_run_id:
        description: '引き継ぐ過去の実行のRun ID(URLの /actions/runs/<ここ>)。同じ判定ルールの結果だけ引き継ぐ'
        required: false
        default: ''
      compare_run_id:
        description: '比較対象(旧結果)の実行のRun ID。指定すると新旧の件数比較をSummaryに出す'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: 過去の監査結果を取得(resume_run_id指定時のみ)
        if: ${{ inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fact-audit-report
          path: previous_reports/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 比較用の旧結果を取得(compare_run_id指定時のみ)
        if: ${{ inputs.compare_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fact-audit-report
          path: compare_old/
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 一次情報照合
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.ids }}" ] && ARGS="$ARGS --ids ${{ inputs.ids }}"
          [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start ${{ inputs.start }}"
          [ -n "${{ inputs.end }}" ] && ARGS="$ARGS --end ${{ inputs.end }}"
          [ -d previous_reports ] && ARGS="$ARGS --resume previous_reports"
          python fact_audit.py $ARGS
      - name: 新旧比較
        if: ${{ always() && inputs.compare_run_id != '' }}
        continue-on-error: true
        run: |
          [ -d compare_old ] || { echo "旧結果を取得できませんでした"; exit 0; }
          python compare_audits.py compare_old audit_reports --out audit_reports/compare.md
          cat audit_reports/compare.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fact-audit-report
          path: audit_reports/
          if-no-files-found: warn
