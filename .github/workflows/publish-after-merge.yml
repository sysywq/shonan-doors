name: Publish Articles After Merge

# 人がマージしたPR(保留記事の Approve で作った「この記事だけを公開する」PR など)で main に新しく入った記事について、
# 本番公開(HTTP 200)を確認してから X投稿・Facebookページ投稿・IndexNow を行う。
# Daily Articles の自動マージは GITHUB_TOKEN による push なのでこの workflow は起動せず、
# Daily Articles 側が公開確認・X投稿・Facebook投稿・IndexNow を行う(二重に動かない)。
# 投稿済みログで同じ記事は二度投稿しない。ログは main ではなくデータbranch
# (X: bot/x-post-log / Facebook: bot/facebook-post-log)に保存する。
'on':
  push:
    branches: [main]
    paths:
      - data/articles.json

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      article_ids: '${{ steps.published.outputs.article_ids }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 新しく公開された記事の公開を確認
        id: published
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python daily_pr.py after-merge --before "$BEFORE" --after "$AFTER"

  indexnow_submit:
    needs: confirm
    if: ${{ needs.confirm.outputs.article_ids != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: IndexNowへ公開したURLを通知
        env:
          ARTICLE_IDS: ${{ needs.confirm.outputs.article_ids }}
        run: python indexnow_submit.py --article-ids "$ARTICLE_IDS"

  # Facebook job validation probe: no secrets, no write permissions, no posting.
  # If this validates, add Facebook-specific settings back incrementally.
  post_to_facebook:
    needs: confirm
    if: ${{ needs.confirm.outputs.article_ids != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: facebook-post
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Facebook job validation probe
        run: echo "Facebook job definition accepted"
