name: Daily Shonan Doors Articles

on:
  schedule:
    # UTC 20:00 = JST 05:00（日本時間 毎朝5時）
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 手動実行もできるようにしておく（テスト用）

# Scheduled RunとworkflowDispatch(手動実行)等が重なった場合に、
# Daily Article Automationが同時実行されないようにする。
# 実行中のrunをキャンセルはせず、後から来たrunを待機させる。
concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # 本日生成に成功し、実際にcommit/pushまで完了した記事のID一覧(カンマ区切り文字列)。
      # X投稿ジョブはこの出力だけを頼りに対象記事を特定する(articles.json全体を
      # 毎回スキャンしたり、日付だけで「今日の記事」を推測したりしない)。
      article_ids: ${{ steps.export_ids.outputs.article_ids }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install anthropic

      # 1) 記事を生成し、data/articles.json に追記する(index.htmlはまだ触らない)。
      #    generate_articles.py は実行結果を /tmp/shonan_doors_run_report.json にも書き出す。
      #    このステップが失敗した場合、後続のbuild/git add/verify/commitは一切実行されない。
      - name: 記事を生成してarticles.jsonに追記
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      # 2) articles.json(Single Source of Truth)から静的ページを再生成する。
      #    記事ページ・地域ハブ・カテゴリハブ・ページネーション・トップページ・
      #    sitemap.xml・robots.txtをすべてここで再構築する。
      #    build.pyは失敗時に本番のarticles/・index.html等を一切変更しない設計。
      #    このステップが失敗した場合、次のgit add/verify/commitは実行されない。
      - name: 静的ページをビルド
        run: python build.py

      # 3) コミット対象をステージする。build.pyが更新しうる範囲を明示的に指定し、
      #    無関係なファイルが誤って巻き込まれないようにする。
      - name: 変更をgit add
        run: |
          git add data/articles.json data/id_counter.json data/stock_topics.json index.html \
                  articles/ area/ category/ page/ sitemap.xml robots.txt

      # 4) 「生成したと報告された記事」が、git add後のステージ内容に実際に
      #    含まれているかを検証する。ここで1件でも食い違いがあれば、
      #    コミットせずワークフロー全体をエラーとして終了する。
      #    (過去に、この検証が無く「Success」なのに実際は何もpushされていない
      #    というサイレント障害が発生したことがあるため追加。
      #    必ずgit add実行後・git commit実行前に呼び出すこと)
      - name: 永続化を検証(サイレント障害防止)
        run: python verify_daily_run.py

      # 5) 検証を通過した場合のみコミット・プッシュする。
      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "shonan-doors-bot"
          git config user.email "bot@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: 本日分の記事を自動追加 ($(date +'%Y-%m-%d'))"
          git push

      # 6) commit/pushまで成功した記事のIDだけを、X投稿ジョブへ引き渡す。
      #    (このステップより前のいずれかが失敗していれば、ジョブ自体が
      #    途中で停止しているため、ここには到達しない=article_idsは空のまま)
      - name: 本日投稿された記事IDを書き出す(X投稿ジョブ向け)
        id: export_ids
        run: |
          python3 -c "
          import json
          with open('/tmp/shonan_doors_run_report.json', encoding='utf-8') as f:
              report = json.load(f)
          ids = report.get('accepted_ids', [])
          print('article_ids=' + ','.join(str(i) for i in ids))
          " >> "$GITHUB_OUTPUT"

  # X(Twitter)への自動投稿。generateジョブが成功した場合のみ実行されるが、
  # あくまで別ジョブとして疎結合にしてあるため、このジョブが失敗しても
  # 記事生成・build・GitHub Pagesへのデプロイ(=generateジョブの成否)には
  # 一切影響しない。
  post_to_x:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.article_ids != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト(最新mainを取得)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install tweepy

      # DRY_RUNは既定で有効(true)。リポジトリのActions variables(Secretsではない)で
      # X_POST_DRY_RUN=false を設定すると本番投稿に切り替わる。
      # 本番投稿にはX_API_KEY等のSecretsが必要(未設定の間はDRY_RUNのままにしておくこと)。
      # post_to_x.py自体が、各記事URLを実際にHTTP 200で取得できるまで
      # 15秒間隔・最大5分でリトライしてから投稿するため、ここで固定sleepを
      # 挟む必要はない(GitHub Pagesのデプロイ時間の変動にも対応できる)。
      - name: Xへ投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ vars.X_POST_DRY_RUN || 'true' }}
        run: python post_to_x.py --article-ids "${{ needs.generate.outputs.article_ids }}"

      # 投稿済みログが更新された(=本番投稿が1件以上成功した)時だけコミットする。
      # ステージ済みの変更がある状態でpull --rebaseを行うとrebaseが拒否される
      # ことがあるため、必ず「add→commit→pull --rebase→push」の順にする。
      - name: 投稿済みログをコミット・プッシュ
        run: |
          git config user.name "shonan-doors-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/x_post_log.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: X投稿済みログを更新"
            git pull --rebase origin main
            git push
          fi

  # Bing等のIndexNow対応検索エンジンへ、本日新規公開した記事URLを通知する。
  # generateジョブが成功した場合のみ実行されるが、あくまで別ジョブとして
  # 疎結合にしてあるため、このジョブが失敗しても記事生成・build・
  # GitHub Pagesへのデプロイ(=generateジョブの成否)やX投稿には一切影響しない。
  # IndexNowはGoogle Search Console/sitemap.xml等の既存SEO実装とは独立した、
  # 補助的な即時クロール依頼の仕組みであり、それらには一切手を加えていない。
  indexnow_submit:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.article_ids != ''
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト(最新mainを取得)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # IndexNowのkeyはその性質上「公開ファイルとして配信される」ことが
      # 仕様上前提のため秘密情報ではなく、GitHub Secretsは使用しない
      # (X_API_KEY等のcredentialとは明確に別枠。indexnow_submit.py内に
      # 直接定義済みで、標準ライブラリのみで動作するため追加パッケージの
      # インストールも不要)。
      - name: IndexNowへ本日公開したURLを通知
        run: python indexnow_submit.py --article-ids "${{ needs.generate.outputs.article_ids }}"
