name: Daily Shonan Doors Articles

on:
  schedule:
    # UTC 20:00 = JST 05:00（日本時間 毎朝5時）
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 手動実行もできるようにしておく（テスト用）

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install anthropic

      - name: 記事を生成してHTMLに追記
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "shonan-doors-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: 本日分の記事3本を自動追加 ($(date +'%Y-%m-%d'))"
          git push
