name: Daily Shonan Doors Articles

on:
  schedule:
    # UTC 20:00 = JST 05:00（日本時間 毎朝5時）
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 手動実行もできるようにしておく（テスト用・再実行用）

# Scheduled RunとworkflowDispatch(手動実行)等が重なった場合に、
# Daily Article Automationが同時実行されないようにする。
# 実行中のrunをキャンセルはせず、後から来たrunを待機させる。
concurrency:
  group: daily-articles
  cancel-in-progress: false

# mainへは直接pushしない。最新mainから当日branch(daily/YYYY-MM-DD)を作り、main向けPRを経由して公開する。
# 流れ: 当日branch → 記事生成(公開前ゲート込み) → Fact Audit full(accepted_idsのみ) → confirmed以外は記事単位で保留
#       → tests → build → 永続化検証 → 当日branchへcommit/push → PR作成 → CI → 全条件合格時のみ自動マージ
#       → main反映・公開確認 → 公開を確認できた記事だけX投稿・IndexNow
# 同じ日の再実行では記事を生成し直さず、既存の当日branch/PRを再利用する(daily_pr.py plan)。
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write        # 当日branchへのpush・PRのマージ
      pull-requests: write   # 当日PRの作成
      issues: write          # 保留記事・公開前監査・最低件数未達・マージ見送りのIssue
      actions: write         # CI(ci.yml)の workflow_dispatch と結果の取得
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      # mainへのマージ後、本番URLで公開を確認できた記事のID一覧(カンマ区切り)。
      # X投稿・IndexNowはこのIDだけを対象にする(保留記事・未公開の記事は含まれない)。
      article_ids: ${{ steps.published.outputs.article_ids }}
    steps:
      - name: リポジトリをチェックアウト(最新main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install anthropic

      - name: git の設定
        run: |
          git config user.name "shonan-doors-bot"
          git config user.email "bot@users.noreply.github.com"

      # 当日branch/PRの状態を確認する。fresh=新規生成 / resume=既存branch・PRの続き / done=マージ済み / closed=人が閉じた
      - name: 当日branch/PRの状態を確認
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_pr.py plan

      - name: 当日branchを作成(最新mainから)
        if: steps.plan.outputs.mode == 'fresh'
        run: git switch -c "${{ steps.plan.outputs.branch }}"

      - name: 既存の当日branchに切り替え(再実行)
        if: steps.plan.outputs.mode == 'resume'
        run: |
          git fetch origin "+refs/heads/${{ steps.plan.outputs.branch }}:refs/remotes/origin/${{ steps.plan.outputs.branch }}"
          git switch -c "${{ steps.plan.outputs.branch }}" "origin/${{ steps.plan.outputs.branch }}"

      # 1) 記事を生成し、公開前ゲートに合格した記事を data/articles.json に追記する。
      #    generate_articles.py は実行結果を /tmp/shonan_doors_run_report.json にも書き出す。
      - name: 記事を生成してarticles.jsonに追記
        if: steps.plan.outputs.mode == 'fresh'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      # 2) accepted_ids を Fact Audit(full。fact_audit.py と同じ監査ロジック)にかける。
      #    一意に直せる誤りは自動修正→verify。confirmed以外の記事だけを保留にして当日PRから外す
      #    (articles.json / stock_topics / event_series を整理。confirmed記事は止めない)。
      - name: Fact Audit(full)と保留記事の分離
        if: steps.plan.outputs.mode == 'fresh'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_fact_audit.py

      # Fact Audit workflow の verify で previous_run_id にこの Run ID を使えるよう、同じ Artifact 名で保存する
      - name: Fact Audit の結果を保存
        if: always() && steps.plan.outputs.mode == 'fresh'
        uses: actions/upload-artifact@v4
        with:
          name: fact-audit-report
          path: audit_reports/
          if-no-files-found: ignore

      # 保留記事の内容(Approve後の公開に使う)。Issue本文にも埋め込むが、念のためArtifactにも残す
      - name: 保留記事のデータを保存
        if: always() && steps.plan.outputs.mode == 'fresh'
        uses: actions/upload-artifact@v4
        with:
          name: daily-held-articles
          path: /tmp/shonan_doors_daily_holds.json
          if-no-files-found: ignore
          retention-days: 90

      # 公開前監査で不合格になった記事・最低件数未達(shortfall)をIssue化する。
      # Issue化は補助的な通知なので、失敗しても合格記事のPR・公開は止めない。
      - name: 公開前監査の不合格記事・最低件数未達をIssue化
        if: steps.plan.outputs.mode == 'fresh'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python report_gate_rejections.py

      # Fact Audit で保留にした記事を、1件につき1つの Approve / Reject Issue にする
      - name: 保留記事をIssue化
        if: steps.plan.outputs.mode == 'fresh'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python report_daily_holds.py

      # X投稿済みログ(データbranch bot/x-post-log)を当日PRに取り込み、mainのログを追いつかせる
      - name: X投稿済みログを取り込む
        if: steps.plan.outputs.mode == 'fresh'
        run: python x_post_log_store.py pull

      - name: ユニットテスト
        if: steps.plan.outputs.mode == 'fresh'
        run: python -m unittest discover -s tests -v

      # 3) articles.json(Single Source of Truth)から静的ページを再生成する(公開対象の記事だけで build)。
      - name: 静的ページをビルド
        if: steps.plan.outputs.mode == 'fresh'
        run: python build.py

      # 4) コミット対象をステージする。build.pyが更新しうる範囲と元データを明示的に指定する。
      #    data/event_series.json(イベントシリーズ台帳)もここで保存する。
      - name: 変更をgit add
        if: steps.plan.outputs.mode == 'fresh'
        run: |
          git add data/articles.json data/id_counter.json data/stock_topics.json data/event_series.json \
                  data/x_post_log.json index.html articles/ area/ category/ page/ sitemap.xml robots.txt

      # 5) 公開対象の記事がステージ内容に含まれ、保留記事が含まれず、台帳の変更が漏れていないことを検証する。
      - name: 永続化を検証(サイレント障害防止)
        if: steps.plan.outputs.mode == 'fresh'
        run: python verify_daily_run.py

      - name: PR用のメタ情報を記録
        if: steps.plan.outputs.mode == 'fresh'
        run: python daily_pr.py record

      # 6) 当日branchへcommit/pushする(mainへはpushしない)
      - name: 当日branchへコミット・プッシュ
        id: push
        if: steps.plan.outputs.mode == 'fresh'
        run: |
          if git diff --cached --quiet; then
            echo "変更がないため、当日PRは作成しません。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -F /tmp/shonan_doors_daily_commit_msg.txt
          git push origin "HEAD:refs/heads/${{ steps.plan.outputs.branch }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: main向けの当日PRを作成
        if: steps.plan.outputs.mode == 'resume' || steps.push.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_pr.py open

      # GITHUB_TOKENで作ったPRではpull_requestのCIが起動しないため、ci.ymlをworkflow_dispatchで起動して待つ
      - name: CIの成功を確認
        if: steps.plan.outputs.mode == 'resume' || steps.push.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_pr.py ci

      # 公開対象がすべてconfirmed・保留記事を含まない・変更ファイルが元データ/生成物だけ・CI成功のときだけマージする
      - name: 条件を満たす場合のみ自動マージ
        if: steps.plan.outputs.mode == 'resume' || steps.push.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_pr.py merge

      # 7) mainへの反映と、各記事URLの本番公開(HTTP 200)を確認する。確認できた記事IDだけをX投稿・IndexNowへ渡す
      - name: 公開を確認
        id: published
        if: steps.plan.outputs.mode == 'done' || steps.plan.outputs.mode == 'resume' || steps.push.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_pr.py published

  # X(Twitter)への自動投稿。本番公開を確認できた記事だけが対象。
  # 投稿済みログは main ではなくデータbranch(bot/x-post-log)に保存する(mainへ直接pushしない)。
  post_to_x:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.article_ids != ''
    runs-on: ubuntu-latest
    concurrency:
      group: x-post
      cancel-in-progress: false
    permissions:
      contents: write   # データbranch bot/x-post-log へのpushのみ(mainは変更しない)
    steps:
      - name: リポジトリをチェックアウト(最新mainを取得)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install tweepy

      # mainとデータbranchのどちらかに記録がある記事は投稿済みとして扱う(二重投稿防止)
      - name: X投稿済みログを取り込む
        run: python x_post_log_store.py pull

      # DRY_RUNは既定で有効(true)。リポジトリのActions variables(Secretsではない)で
      # X_POST_DRY_RUN=false を設定すると本番投稿に切り替わる。
      - name: Xへ投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ vars.X_POST_DRY_RUN || 'true' }}
        run: python post_to_x.py --article-ids "${{ needs.generate.outputs.article_ids }}"

      # 投稿に一部失敗しても、成功分の記録は必ず保存する
      - name: 投稿済みログをデータbranchに保存
        if: always()
        run: |
          python x_post_log_store.py push --message "chore: X投稿済みログを更新 (Daily Articles)"

  # Bing等のIndexNow対応検索エンジンへ、本番公開を確認できた記事URLを通知する。
  indexnow_submit:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.article_ids != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト(最新mainを取得)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: IndexNowへ本日公開したURLを通知
        run: python indexnow_submit.py --article-ids "${{ needs.generate.outputs.article_ids }}"
